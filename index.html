<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طريق التوبة | Cinematic Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#101215;color:#eee;font-family:Tahoma,Arial,sans-serif}main{max-width:1100px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:24px;margin:0;color:#efce91}small{color:#aaa}canvas{width:100%;display:block;border-radius:12px;background:#000;aspect-ratio:16/9}button{background:#292d33;color:white;border:1px solid #464b52;border-radius:8px;padding:11px 16px;cursor:pointer;font:inherit}button:hover,button.active{background:#785e36}button:disabled{opacity:.5} .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}input[type=range]{width:100%;accent-color:#d5b77b;direction:ltr}.scenes{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.scenes button{padding:4px;text-align:center;font-size:12px}.scenes img{width:100%;border-radius:5px;display:block;margin-bottom:5px}#status{color:#bbb;font-size:13px;line-height:1.8}label{font-size:13px}select{background:#292d33;color:white;padding:8px;border:1px solid #555;border-radius:7px}</style><main><header><div><h1>طريق التوبة</h1><small>قصص تُحيي القلوب · Cinematic Studio</small></div><small>V3 · Local Motion / HD 16:9</small></header><canvas id="screen" width="1280" height="720"></canvas><input id="seek" type="range" min="0" max="64" step="0.05" value="0"><div class="controls"><button id="play">▶ تشغيل</button><button id="restart">↻ البداية</button><button id="record">تصدير الفيديو</button><label><input type="checkbox" id="voice"> سرد صوتي (حسب المتصفح)</label><label><input type="checkbox" id="captions" checked> النص</label><label>قوة الحركة <select id="motionStrength"><option value="0">ثابت</option><option value="1.5">خفيفة</option><option value="3.5" selected>واضحة</option><option value="5">قوية</option></select></label><span id="clock" dir="ltr">00:00 / 01:04</span></div><div class="scenes" id="scenes"></div><p id="status">جاهز — اختر مشهداً أو شغّل الفيلم. التصدير يسجل الصورة والنص بصيغة WebM دون صوت.</p></main><script>
const data=[['الندم',8,'كان رجل قد قتل تسعة وتسعين نفسًا، ثم أراد أن يتوب إلى الله.'],['سؤال الراهب',8,'فسأل عن أعلم أهل الأرض، فدلّوه على راهب. قال: هل لي من توبة؟ فقال: لا.'],['لحظة اليأس',6,'فقتله، فأكمل به المائة. لكنه لم يفقد الأمل في رحمة الله.'],['باب التوبة',9,'فسأل مرة أخرى، فدلّوه على عالم، فقال له: ومن يحول بينك وبين التوبة؟'],['أرض الصالحين',8,'ونصحه بأن يترك أرض السوء ويتوجه إلى أرض فيها أناس صالحون يعبدون الله.'],['الرحيل',8,'فخرج الرجل تائبًا، وفي منتصف الطريق أدركه الموت.'],['الرحمة والعذاب',9,'فاختصمت فيه ملائكة الرحمة وملائكة العذاب، فقاسوا المسافة بين الأرضين.'],['رحمة الله',8,'فوجدوه أقرب إلى أرض الصالحين، فقبضته ملائكة الرحمة. لا تقنط من رحمة الله.']];
const $=id=>document.getElementById(id), c=$('screen'),x=c.getContext('2d'),W=c.width,H=c.height;let starts=[],total=0;data.forEach(d=>{starts.push(total);total+=d[1]});$('seek').max=total;let t=0,playing=false,last=0,current=-1,ready=false,rec=null,chunks=[];const imgs=data.map((d,i)=>{let im=new Image();im.src=`assets/${i+1}.jpg`;return im});const particles=Array.from({length:100},(_,i)=>({a:(i*73.71)%W,b:(i*43.17)%H,r:0.5+(i%7)/4,v:7+i%19}));
function sceneAt(s){return Math.max(0,starts.findLastIndex(v=>v<=s))}// Local mesh motion: fixed camera, smoothly anchored deformation fields.
const motionRegions=[
[[.35,.30,.13,.19,2,5,.55],[.24,.65,.16,.22,9,7,.45],[.49,.64,.15,.23,8,7,.5],[.39,.73,.25,.24,6,3,.7]],
[[.29,.35,.11,.15,3,5,.65],[.43,.62,.17,.16,10,6,.6],[.69,.34,.11,.15,3,4,.55],[.70,.65,.13,.22,4,3,.7]],
[[.35,.32,.12,.16,4,6,.55],[.20,.62,.14,.18,7,5,.5],[.50,.57,.13,.20,8,7,.6]],
[[.29,.34,.11,.15,3,4,.5],[.33,.63,.15,.20,6,4,.65],[.72,.31,.10,.13,3,4,.55],[.57,.54,.17,.14,9,6,.6]],
[[.29,.37,.11,.15,3,4,.55],[.56,.32,.11,.15,3,4,.5],[.70,.43,.19,.14,8,5,.55],[.30,.68,.18,.20,6,3,.7]],
[[.39,.29,.11,.16,3,5,.8],[.32,.59,.22,.24,12,4,.8],[.40,.76,.12,.19,12,7,1.1],[.53,.80,.11,.17,-12,6,1.1]],
[[.29,.75,.20,.17,4,3,.4],[.22,.32,.20,.24,10,7,.5],[.72,.32,.21,.24,9,8,.55]],
[[.25,.36,.17,.23,6,4,.5],[.72,.33,.17,.23,7,4,.55],[.50,.24,.12,.16,3,4,.4]]
];
function meshFrame(im,i,seconds){
 const nx=32,ny=20,sw=im.naturalWidth,sh=im.naturalHeight,regions=motionRegions[i];
 const points=[],strength=Number($('motionStrength').value);
 for(let j=0;j<=ny;j++)for(let k=0;k<=nx;k++){
  const u=k/nx,v=j/ny;let dx=0,dy=0;
  for(const [cx,cy,rx,ry,ax,ay,f] of regions){
   const d=((u-cx)/rx)**2+((v-cy)/ry)**2;
   if(d>=1)continue;
   const weight=(1-d)**2,phase=seconds*2*Math.PI*f+cx*3;
   dx+=ax*weight*strength*Math.sin(phase);dy+=ay*weight*strength*Math.sin(phase+.8);
  }
  const edge=Math.min(1,u*20,(1-u)*20,v*20,(1-v)*20);
  points.push({sx:u*sw,sy:v*sh,x:u*W+dx*edge,y:v*H+dy*edge});
 }
 function tri(a,b,d){
  const ux=b.sx-a.sx,uy=b.sy-a.sy,vx=d.sx-a.sx,vy=d.sy-a.sy,det=ux*vy-uy*vx;
  if(!det)return;
  const X=b.x-a.x,Y=b.y-a.y,U=d.x-a.x,V=d.y-a.y;
  const A=(X*vy-U*uy)/det,B=(Y*vy-V*uy)/det,C=(U*ux-X*vx)/det,D=(V*ux-Y*vx)/det;
  const mx=(a.x+b.x+d.x)/3,my=(a.y+b.y+d.y)/3;
  x.save();x.beginPath();
  [a,b,d].forEach((q,n)=>{const dx=q.x-mx,dy=q.y-my,l=Math.hypot(dx,dy)||1;const px=q.x+dx/l*.85,py=q.y+dy/l*.85;if(n)x.lineTo(px,py);else x.moveTo(px,py)});
  x.closePath();x.clip();x.transform(A,B,C,D,a.x-A*a.sx-C*a.sy,a.y-B*a.sx-D*a.sy);x.drawImage(im,0,0);x.restore();
 }
 for(let j=0;j<ny;j++)for(let k=0;k<nx;k++){const a=points[j*(nx+1)+k],b=points[j*(nx+1)+k+1],d=points[(j+1)*(nx+1)+k],e=points[(j+1)*(nx+1)+k+1]; const moved=q=>Math.abs(q.x-q.sx/sw*W)+Math.abs(q.y-q.sy/sh*H)>.01;if(moved(a)||moved(b)||moved(d)||moved(e)){tri(a,b,d);tri(b,e,d)}}
}
function drawScene(i,p,alpha=1){
 const im=imgs[i];if(!im.complete||!im.naturalWidth)return;
 x.save();x.globalAlpha=alpha;x.drawImage(im,0,0,W,H);
 // Draw only moving triangles over the fixed base image.
 if(alpha===1)meshFrame(im,i,p*data[i][1]);
 x.restore();
}
function wrap(s,max){let lines=[],line='';for(let word of s.split(' ')){let a=line?line+' '+word:word;if(x.measureText(a).width>max&&line){lines.push(line);line=word}else line=a}if(line)lines.push(line);return lines}
function render(){let i=sceneAt(t),p=Math.min(1,(t-starts[i])/data[i][1]);x.fillStyle='#08090c';x.fillRect(0,0,W,H);drawScene(i,p);if(i>0&&t-starts[i]<.65)drawScene(i-1,1,1-(t-starts[i])/.65);let glow=x.createRadialGradient(W*.84,H*.21,5,W*.84,H*.21,430);glow.addColorStop(0,`rgba(255,204,125,${(i>=3?.09:.025)*(1+.25*Math.sin(t*1.5))})`);glow.addColorStop(1,'transparent');x.fillStyle=glow;x.fillRect(0,0,W,H);for(let q of particles){let a=(q.a+t*q.v)%W,b=(q.b+Math.sin(t*.6+q.a)*16+H)%H;x.beginPath();x.fillStyle=`rgba(240,211,161,${.10+.12*Math.sin(t+q.a)**2})`;x.arc(a,b,q.r,0,Math.PI*2);x.fill()}let v=x.createRadialGradient(W/2,H/2,H*.32,W/2,H/2,W*.65);v.addColorStop(0,'transparent');v.addColorStop(1,'rgba(0,0,0,.55)');x.fillStyle=v;x.fillRect(0,0,W,H);if($('captions').checked){let g=x.createLinearGradient(0,H-190,0,H);g.addColorStop(0,'transparent');g.addColorStop(1,'rgba(0,0,0,.91)');x.fillStyle=g;x.fillRect(0,H-190,W,190);x.direction='rtl';x.textAlign='center';x.fillStyle='#f0cd8e';x.font='bold 25px Arial';x.fillText(data[i][0],W/2,H-116);x.font='bold 30px Arial';x.fillStyle='#fff';let lines=wrap(data[i][2],W-170);lines.forEach((l,j)=>x.fillText(l,W/2,H-73+j*36))}if(i!==current){current=i;document.querySelectorAll('.scenes button').forEach((b,j)=>b.classList.toggle('active',j===i));if(playing)speak(i)}$('seek').value=t;$('clock').textContent=fmt(t)+' / '+fmt(total)}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')}function speak(i){if(!$('voice').checked||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(data[i][2]);u.lang='ar';u.rate=.96;let v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ar'));if(v)u.voice=v;speechSynthesis.speak(u)}function setPlay(b){playing=b;last=0;$('play').textContent=b?'Ⅱ إيقاف':'▶ تشغيل';if(b)speak(sceneAt(t));else if('speechSynthesis'in window)speechSynthesis.cancel()}function jump(s){t=s;current=-1;render()}function loop(now){if(ready&&playing){if(last)t=Math.min(total,t+(now-last)/1000);last=now;render();if(t>=total){setPlay(false);if(rec&&rec.state==='recording')rec.stop()}}requestAnimationFrame(loop)}$('play').onclick=()=>{if(!ready)return;if(t>=total)jump(0);setPlay(!playing)};$('restart').onclick=()=>{if(ready)jump(0)};$('seek').oninput=e=>{if(ready)jump(+e.target.value)};$('captions').onchange=render;$('motionStrength').onchange=render;$('voice').onchange=()=>{if(playing)speak(sceneAt(t));if(!$('voice').checked&&'speechSynthesis'in window)speechSynthesis.cancel()};data.forEach((d,i)=>{let b=document.createElement('button');b.innerHTML=`<img src="assets/${i+1}.jpg" alt="">${i+1} · ${d[0]}`;b.onclick=()=>{if(ready)jump(starts[i])};$('scenes').append(b)});
$('record').onclick=()=>{if(!ready)return;if(!c.captureStream||!window.MediaRecorder){$('status').textContent='التصدير غير مدعوم في هذا المتصفح. جرّب Chrome.';return}try{let mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));rec=new MediaRecorder(c.captureStream(30),mime?{mimeType:mime,videoBitsPerSecond:6000000}:{});chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{let url=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType})),a=document.createElement('a');a.href=url;a.download='tariq-al-tawba.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);$('status').textContent='تم التصدير دون صوت.';['play','restart','seek','record'].forEach(id=>$(id).disabled=false);document.querySelectorAll('.scenes button').forEach(b=>b.disabled=false)};setPlay(false);jump(0);rec.start();['play','restart','seek','record'].forEach(id=>$(id).disabled=true);document.querySelectorAll('.scenes button').forEach(b=>b.disabled=true);$('status').textContent='التسجيل جارٍ — اترك الصفحة مفتوحة حتى نهاية الفيلم.';setPlay(true)}catch(e){$('status').textContent='تعذر التسجيل: '+e.message}};
Promise.all(imgs.map(im=>im.decode())).then(()=>{ready=true;render()}).catch(()=>{$('status').textContent='تعذر تحميل الصور. تأكد من استخراج كامل المجلد.'});requestAnimationFrame(loop);
</script></html>
