<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طريق التوبة | Cinematic Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#101215;color:#eee;font-family:Tahoma,Arial,sans-serif}main{max-width:1100px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:24px;margin:0;color:#efce91}small{color:#aaa}canvas{width:100%;display:block;border-radius:12px;background:#000;aspect-ratio:16/9}button{background:#292d33;color:white;border:1px solid #464b52;border-radius:8px;padding:11px 16px;cursor:pointer;font:inherit}button:hover,button.active{background:#785e36}button:disabled{opacity:.5} .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}input[type=range]{width:100%;accent-color:#d5b77b;direction:ltr}.scenes{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.scenes button{padding:4px;text-align:center;font-size:12px}.scenes img{width:100%;border-radius:5px;display:block;margin-bottom:5px}#status{color:#bbb;font-size:13px;line-height:1.8}label{font-size:13px}select{background:#292d33;color:white;padding:8px;border:1px solid #555;border-radius:7px}</style><main><header><div><h1>طريق التوبة</h1><small>قصص تُحيي القلوب · Cinematic Studio</small></div><small>V5.1 · Arabic narrator</small></header><canvas id="screen" width="1280" height="720"></canvas><input id="seek" type="range" min="0" max="64" step="0.05" value="0"><div class="controls"><button id="play">▶ تشغيل</button><button id="restart">↻ البداية</button><button id="record">تصدير الفيديو</button><label><input type="checkbox" id="voice" checked> الراوي العربي</label><label>الصوت <select id="voiceSelect"></select></label><label>السرعة <select id="voiceRate"><option value=".8">هادئ</option><option value=".92" selected>متوازن</option><option value="1.05">سريع</option></select></label><button id="voiceTest">استمع إلى الراوي</button><label><input type="checkbox" id="captions" checked> النص</label><span id="clock" dir="ltr">00:00 / 01:04</span></div><div class="scenes" id="scenes"></div><p id="status">جاهز — اختر مشهداً أو شغّل الفيلم. التصدير يسجل الصورة والنص بصيغة WebM دون صوت.</p></main><script>
const data=[['الندم',8,'كان رجل قد قتل تسعة وتسعين نفسًا، ثم أراد أن يتوب إلى الله.'],['سؤال الراهب',8,'فسأل عن أعلم أهل الأرض، فدلّوه على راهب. قال: هل لي من توبة؟ فقال: لا.'],['لحظة اليأس',6,'فقتله، فأكمل به المائة. لكنه لم يفقد الأمل في رحمة الله.'],['باب التوبة',9,'فسأل مرة أخرى، فدلّوه على عالم، فقال له: ومن يحول بينك وبين التوبة؟'],['أرض الصالحين',8,'ونصحه بأن يترك أرض السوء ويتوجه إلى أرض فيها أناس صالحون يعبدون الله.'],['الرحيل',8,'فخرج الرجل تائبًا، وفي منتصف الطريق أدركه الموت.'],['الرحمة والعذاب',9,'فاختصمت فيه ملائكة الرحمة وملائكة العذاب، فقاسوا المسافة بين الأرضين.'],['رحمة الله',8,'فوجدوه أقرب إلى أرض الصالحين، فقبضته ملائكة الرحمة. لا تقنط من رحمة الله.']];
const $=id=>document.getElementById(id), c=$('screen'),x=c.getContext('2d'),W=c.width,H=c.height;let starts=[],total=0;data.forEach(d=>{starts.push(total);total+=d[1]});$('seek').max=total;let t=0,playing=false,last=0,current=-1,ready=false,rec=null,chunks=[];const imgs=data.map((d,i)=>{let im=new Image();im.src=`assets/${i+1}.jpg`;return im});const particles=Array.from({length:100},(_,i)=>({a:(i*73.71)%W,b:(i*43.17)%H,r:0.5+(i%7)/4,v:7+i%19}));
function sceneAt(s){return Math.max(0,starts.findLastIndex(v=>v<=s))}// V4: real image sequences, independent from camera motion.
const sequences=Array(8).fill(null);
const sequenceInput=document.createElement('input');sequenceInput.type='file';sequenceInput.accept='image/*';sequenceInput.style.display='none';document.body.append(sequenceInput);
const attach=document.createElement('button');attach.textContent='إضافة تسلسل صور للمشهد';$('record').after(attach);
const mode=document.createElement('span');mode.style.fontSize='12px';attach.after(mode);
function refreshSequenceStatus(){const i=sceneAt(t);mode.textContent=i===1&&hdFrames.length?'HD · '+hdFrames.length+' images':sequences[i]?'Frame-by-frame · '+sequences[i].count+' frames':'مشهد ثابت — أضف تسلسل الصور';}
async function loadSheet(src,i,cols=6,rows=5,count=30){const im=new Image();im.src=src;await im.decode();sequences[i]={im,cols,rows,count};refreshSequenceStatus();if(ready)render();}
attach.onclick=()=>sequenceInput.click();
sequenceInput.onchange=async()=>{const file=sequenceInput.files[0];if(!file)return;const i=sceneAt(t);const reader=new FileReader();reader.onload=async()=>{try{await loadSheet(reader.result,i);try{localStorage.setItem('eltawba-sheet-'+i,reader.result)}catch{} }catch(e){$('status').textContent='تعذر تحميل تسلسل الصور: '+e.message}};reader.readAsDataURL(file);sequenceInput.value='';};
function drawScene(i,p,alpha=1){if(i===1&&hdFrames.length){drawHD(p,alpha);return;}const im=imgs[i],seq=sequences[i];x.save();x.globalAlpha=alpha;if(im.complete&&im.naturalWidth)x.drawImage(im,0,0,W,H);if(seq){const n=Math.min(seq.count-1,Math.floor(Math.max(0,p)*seq.count)),fw=seq.im.naturalWidth/seq.cols,fh=i===1?seq.im.naturalHeight*1028/1120/5:seq.im.naturalHeight/seq.rows;const scale=Math.min(W/fw,H/fh),dw=fw*scale,dh=fh*scale;x.fillStyle='#08090c';x.fillRect(0,0,W,H);x.drawImage(seq.im,(n%seq.cols)*fw+2,Math.floor(n/seq.cols)*fh+2,fw-4,fh-4,(W-dw)/2,(H-dh)/2,dw,dh);}x.restore();}
for(let i=0;i<8;i++){let stored;try{stored=localStorage.getItem('eltawba-sheet-'+i)}catch{}const bundled=i===1?'assets/8b529825-ad76-4348-88ba-241725811ace.png':'assets/frames-'+(i+1)+'.jpg';loadSheet(stored||bundled,i).catch(()=>{if(stored)loadSheet(bundled,i).catch(()=>{});});}
const hdFrames=[];
const hdInput=document.createElement('input');hdInput.type='file';hdInput.accept='image/*';hdInput.multiple=true;hdInput.style.display='none';document.body.append(hdInput);
const hdButton=document.createElement('button');hdButton.textContent='تحميل صور HD للمشهد الثاني';attach.after(hdButton);hdButton.onclick=()=>hdInput.click();
async function decodeHD(src){const im=new Image();im.src=src;await im.decode();return im;}
async function loadHD(){try{const arr=await Promise.all(Array.from({length:10},(_,i)=>decodeHD('assets/scene2/'+String(i+1).padStart(3,'0')+'.jpg')));hdFrames.splice(0,hdFrames.length,...arr);refreshSequenceStatus();if(ready)render();}catch(e){console.info('HD sequence not yet bundled',e);}}
hdInput.onchange=async()=>{try{const files=Array.from(hdInput.files).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(!files.length)return;const arr=await Promise.all(files.map(async file=>{const url=URL.createObjectURL(file);try{return await decodeHD(url)}finally{URL.revokeObjectURL(url)}}));hdFrames.splice(0,hdFrames.length,...arr);refreshSequenceStatus();if(ready)render();}catch(e){$('status').textContent=e.message;}};
function drawHD(p,alpha){const n=Math.min(hdFrames.length-1,Math.floor(Math.max(0,p)*hdFrames.length));const im=hdFrames[n];x.save();x.globalAlpha=alpha;x.drawImage(im,0,0,W,H);x.restore();}
loadHD();

function wrap(s,max){let lines=[],line='';for(let word of s.split(' ')){let a=line?line+' '+word:word;if(x.measureText(a).width>max&&line){lines.push(line);line=word}else line=a}if(line)lines.push(line);return lines}
function render(){let i=sceneAt(t),p=Math.min(1,(t-starts[i])/data[i][1]);x.fillStyle='#08090c';x.fillRect(0,0,W,H);drawScene(i,p);if(i>0&&t-starts[i]<.65)drawScene(i-1,1,1-(t-starts[i])/.65);let glow=x.createRadialGradient(W*.84,H*.21,5,W*.84,H*.21,430);glow.addColorStop(0,`rgba(255,204,125,${(i>=3?.09:.025)*(1+.25*Math.sin(t*1.5))})`);glow.addColorStop(1,'transparent');x.fillStyle=glow;x.fillRect(0,0,W,H);for(let q of particles){let a=(q.a+t*q.v)%W,b=(q.b+Math.sin(t*.6+q.a)*16+H)%H;x.beginPath();x.fillStyle=`rgba(240,211,161,${.10+.12*Math.sin(t+q.a)**2})`;x.arc(a,b,q.r,0,Math.PI*2);x.fill()}let v=x.createRadialGradient(W/2,H/2,H*.32,W/2,H/2,W*.65);v.addColorStop(0,'transparent');v.addColorStop(1,'rgba(0,0,0,.55)');x.fillStyle=v;x.fillRect(0,0,W,H);if($('captions').checked){let g=x.createLinearGradient(0,H-190,0,H);g.addColorStop(0,'transparent');g.addColorStop(1,'rgba(0,0,0,.91)');x.fillStyle=g;x.fillRect(0,H-190,W,190);x.direction='rtl';x.textAlign='center';x.fillStyle='#f0cd8e';x.font='bold 25px Arial';x.fillText(data[i][0],W/2,H-116);x.font='bold 30px Arial';x.fillStyle='#fff';let lines=wrap(data[i][2],W-170);lines.forEach((l,j)=>x.fillText(l,W/2,H-73+j*36))}if(i!==current){current=i;refreshSequenceStatus();document.querySelectorAll('.scenes button').forEach((b,j)=>b.classList.toggle('active',j===i));if(playing)speak(i)}$('seek').value=t;$('clock').textContent=fmt(t)+' / '+fmt(total)}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')}const narration=[
'كَانَ رَجُلٌ قَدْ قَتَلَ تِسْعَةً وَتِسْعِينَ نَفْسًا. ثُمَّ أَرَادَ أَنْ يَتُوبَ إِلَى اللَّهِ.',
'فَسَأَلَ عَنْ أَعْلَمِ أَهْلِ الْأَرْضِ، فَدَلُّوهُ عَلَى رَاهِبٍ. فَقَالَ: هَلْ لِي مِنْ تَوْبَةٍ؟ فَقَالَ: لَا.',
'فَقَتَلَهُ، فَأَكْمَلَ بِهِ الْمِائَةَ. لَكِنَّهُ لَمْ يَفْقِدِ الْأَمَلَ فِي رَحْمَةِ اللَّهِ.',
'فَسَأَلَ مَرَّةً أُخْرَى، فَدَلُّوهُ عَلَى عَالِمٍ. فَقَالَ لَهُ: وَمَنْ يَحُولُ بَيْنَكَ وَبَيْنَ التَّوْبَةِ؟',
'وَنَصَحَهُ بِأَنْ يَتْرُكَ أَرْضَ السُّوءِ، وَيَتَوَجَّهَ إِلَى أَرْضٍ فِيهَا أُنَاسٌ صَالِحُونَ يَعْبُدُونَ اللَّهَ.',
'فَخَرَجَ الرَّجُلُ تَائِبًا، وَفِي مُنْتَصَفِ الطَّرِيقِ أَدْرَكَهُ الْمَوْتُ.',
'فَاخْتَصَمَتْ فِيهِ مَلَائِكَةُ الرَّحْمَةِ وَمَلَائِكَةُ الْعَذَابِ، فَقَاسُوا الْمَسَافَةَ بَيْنَ الْأَرْضَيْنِ.',
'فَوَجَدُوهُ أَقْرَبَ إِلَى أَرْضِ الصَّالِحِينَ، فَقَبَضَتْهُ مَلَائِكَةُ الرَّحْمَةِ. لَا تَقْنَطْ مِنْ رَحْمَةِ اللَّهِ.'
];
let arabicVoices=[],activeSpeech=null,speechToken=0,speechPending=false;
function stopNarration(){speechToken++;speechPending=false;activeSpeech=null;if('speechSynthesis'in window)speechSynthesis.cancel();}
function refreshVoices(){if(!('speechSynthesis'in window))return;const select=$('voiceSelect'),prev=select.value;arabicVoices=speechSynthesis.getVoices().filter(v=>/^ar(?:-|_|$)/i.test(v.lang)).sort((a,b)=>Number(/natural|online|neural/i.test(b.name))-Number(/natural|online|neural/i.test(a.name)));select.replaceChildren();for(const v of arabicVoices){let o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' ('+v.lang+')';select.append(o)}if(arabicVoices.some(v=>v.voiceURI===prev))select.value=prev;if(!arabicVoices.length){let o=document.createElement('option');o.textContent='لا يوجد صوت عربي — أضف صوتًا من إعدادات الجهاز';o.value='';select.append(o)}}
if('speechSynthesis'in window){refreshVoices();speechSynthesis.addEventListener('voiceschanged',refreshVoices);}
function speak(i,preview=false){stopNarration();if((!$('voice').checked&&!preview)||!('speechSynthesis'in window))return;const v=arabicVoices.find(v=>v.voiceURI===$('voiceSelect').value)||arabicVoices[0];if(!v){$('status').textContent='لا يوجد صوت عربي متاح. جرّب Microsoft Edge أو أضف صوتًا عربيًا إلى النظام.';return;}const token=speechToken,u=new SpeechSynthesisUtterance(narration[i]);activeSpeech=u;u.voice=v;u.lang=v.lang;u.rate=Number($('voiceRate').value);u.pitch=.95;speechPending=!preview;let finish=()=>{if(token===speechToken){speechPending=false;activeSpeech=null;last=0}};u.onend=finish;u.onerror=e=>{if(token===speechToken){finish();$('status').textContent='تعذر تشغيل الصوت: '+e.error;}};speechSynthesis.speak(u);}
$('voiceTest').onclick=()=>{if(playing)setPlay(false);speak(sceneAt(t),true);};
$('voiceSelect').onchange=()=>{if(playing)speak(sceneAt(t));};
$('voiceRate').onchange=()=>{if(playing)speak(sceneAt(t));};
function setPlay(b){playing=b;last=0;$('play').textContent=b?'Ⅱ إيقاف':'▶ تشغيل';if(b)speak(sceneAt(t));else stopNarration()}function jump(s){t=s;current=-1;render()}function loop(now){if(ready&&playing){if(last){const end=starts[sceneAt(t)]+data[sceneAt(t)][1];const next=Math.min(total,t+(now-last)/1000);t=speechPending&&!(rec&&rec.state==='recording')?Math.min(next,end-.001):next;}last=now;render();if(t>=total){setPlay(false);if(rec&&rec.state==='recording')rec.stop()}}requestAnimationFrame(loop)}$('play').onclick=()=>{if(!ready)return;if(t>=total)jump(0);setPlay(!playing)};$('restart').onclick=()=>{if(ready)jump(0)};$('seek').oninput=e=>{if(ready)jump(+e.target.value)};$('captions').onchange=render;$('voice').onchange=()=>{if(playing)speak(sceneAt(t));if(!$('voice').checked)stopNarration()};data.forEach((d,i)=>{let b=document.createElement('button');b.innerHTML=`<img src="assets/${i+1}.jpg" alt="">${i+1} · ${d[0]}`;b.onclick=()=>{if(ready)jump(starts[i])};$('scenes').append(b)});
$('record').onclick=()=>{if(!ready)return;if(!c.captureStream||!window.MediaRecorder){$('status').textContent='التصدير غير مدعوم في هذا المتصفح. جرّب Chrome.';return}try{let mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));rec=new MediaRecorder(c.captureStream(30),mime?{mimeType:mime,videoBitsPerSecond:6000000}:{});chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{let url=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType})),a=document.createElement('a');a.href=url;a.download='tariq-al-tawba.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);$('status').textContent='تم التصدير دون صوت.';['play','restart','seek','record'].forEach(id=>$(id).disabled=false);document.querySelectorAll('.scenes button').forEach(b=>b.disabled=false)};setPlay(false);jump(0);rec.start();['play','restart','seek','record'].forEach(id=>$(id).disabled=true);document.querySelectorAll('.scenes button').forEach(b=>b.disabled=true);$('status').textContent='التسجيل جارٍ — اترك الصفحة مفتوحة حتى نهاية الفيلم.';setPlay(true)}catch(e){$('status').textContent='تعذر التسجيل: '+e.message}};
Promise.all(imgs.map(im=>im.decode())).then(()=>{ready=true;render()}).catch(()=>{$('status').textContent='تعذر تحميل الصور. تأكد من استخراج كامل المجلد.'});requestAnimationFrame(loop);
</script></html>
